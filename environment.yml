# MOSAIC main conda environment ("mosaic").
#
#   conda env create -f environment.yml
#   conda activate mosaic
#
# Provenance of the versions below
# --------------------------------
# * Command-line tools and Python libraries: pinned to the live "mosaic" conda
#   env that produced the manuscript results; full export in versions.txt
#   (`conda list --export`). Tool versions are reported in Supplementary
#   Table S10.
# * R / Bioconductor: the manuscript results were produced with the SYSTEM R
#   4.5.1 (not a conda R), with the package versions listed in r_versions.txt
#   (installed via BiocManager; see scripts/install_r_packages.R). The R stack is
#   therefore NOT part of versions.txt. The r-base and R-package pins below
#   reproduce the same package versions inside conda, on r-base 4.5.2.
# * Two tools run in SEPARATE environments and are NOT part of this file:
#     - Telescope 1.0.3  (benchmark only) -> environment_telescope.yml (Python 3.7)
#     - HUMAnN3 / MetaPhlAn (optional M20b) -> conda env "humann3"
# * Binary/script tools not on conda (paths set in config.yaml):
#     - Arriba 2.4.0        (M15; download binary release)
#   JACUSA2 2.1.16 IS provided by bioconda (jar under share/).
#   DCC 0.5.0 IS provided by bioconda (see below).
#   CIRI2 removed in v1.1.1: M06 now uses DCC on STAR chimeric junction files.
# * Known transitive dependency not listed explicitly: blast 2.5.0 (blastn -version)
#   (pulled in via kraken2 or suppa). Not used directly by MOSAIC scripts.
name: mosaic
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # ── Core interpreters ──────────────────────────────────────────────────────
  - python=3.11.9
  - r-base=4.5.2
  # ── Read trimming / QC ─────────────────────────────────────────────────────
  - fastp=1.1.0
  - rseqc=5.0.4
  # ── Alignment ──────────────────────────────────────────────────────────────
  - star=2.7.10b
  - hisat2=2.2.2                 # independent validation pipeline (§4.7)
  - bowtie2=2.5.4                # TE/satellite family quantification (M05)
  # ── Quantification / utilities ─────────────────────────────────────────────
  - subread=2.1.1                # featureCounts (M08)
  - bedtools=2.31.1              # TE locus overlap counting (M12)
  - samtools=1.23
  # ── Splicing ───────────────────────────────────────────────────────────────
  - rmats=4.3.0                  # M17
  - suppa=2.4                    # splicing benchmark (§4.8)
  # ── Transcript assembly ────────────────────────────────────────────────────
  - stringtie=2.1.7              # M16
  - gffcompare=0.12.10
  # ── Gene-quant benchmark ───────────────────────────────────────────────────
  - salmon=2.2.1                 # §4.8
  # ── RNA editing ────────────────────────────────────────────────────────────
  - jacusa2=2.1.16               # M19
  - dcc=0.5.0                    # M06 circRNA detection (STAR chimeric junctions)
  - bwa=0.7.18                   # M23 TE insertion detection (default aligner)
  # ── Metatranscriptomics (optional M20) ─────────────────────────────────────
  - kraken2=2.17.1
  # ── Python libraries ───────────────────────────────────────────────────────
  - pysam=0.23.3
  - numpy=1.26.4
  - pandas
  - scipy
  - pyyaml
  - matplotlib-base
  - adjusttext
  # ── R / Bioconductor stack (pinned to manuscript versions) ─────────────────
  - bioconductor-deseq2=1.50.2
  - r-ashr=2.2.63                # lfcShrink type="ashr"
  - bioconductor-clusterprofiler=4.18.4
  - bioconductor-org.hs.eg.db    # m10_go: GO enrichment annotation
  - bioconductor-genomicfeatures # m08: gene-length fallback (exon union)
  - r-wgcna=1.74
  - bioconductor-stringdb=2.22.0
  - r-optparse=1.7.5
  - r-dplyr=1.2.0
  - r-data.table
  - r-ggplot2
  - r-pheatmap                   # m14_report: heatmap
  - r-kableextra                 # m14_report: HTML tables
  - r-dt                         # m14_report: interactive DataTables (DT::datatable)
  # ── Testing ────────────────────────────────────────────────────────────────
  - pytest                       # smoke test runner (tests/ directory)
  # ── pip-only ───────────────────────────────────────────────────────────────
  - pip
  - pip:
      - REDItools3==3.7          # editing benchmark (§4.8), chr1 only
