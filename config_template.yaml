# MOSAIC config template v2.0
# Generated by: mosaic init
# Edit all paths and parameters before running.
# Run: mosaic check config.yaml  to validate
# Run: mosaic preflight config.yaml  to verify/download databases

# =============================================================================
# PROJECT
# =============================================================================
project:
  name: my_project
  wd: /path/to/workdir          # output directory
  organism: human               # human | mouse | rat | zebrafish
  genome_build: hg38            # hg38 | hg19 | mm39 | mm10 | rn7 | GRCz11
  annotation_version: gencode_v49  # for reproducibility
  biological_context: tumor     # tumor | aging | congenital | other
  random_seed: 42

# =============================================================================
# SEQUENCING LIBRARY
# =============================================================================
sequencing:
  type: PE                      # PE (paired-end) | SE (single-end)
  read_length: 150
  strandedness: auto            # auto | RF | FR | unstranded
  # auto = RSeQC infer_experiment.py per sample

library:
  prep: rRNA_depletion          # rRNA_depletion | polyA (polyA BLOCKS TE analysis)
  layout: PE                    # PE | SE

# =============================================================================
# SAMPLES
# =============================================================================
samples:
  fastq_dir: /path/to/fastq     # directory with sample subdirectories
  coldata: /path/to/coldata.tsv # sample_id, condition [, batch, ...]

  # Optional: download FASTQs automatically
  # download:
  #   - sample_id: SRR19388325
  #     source: sra              # ena | sra | url | ssh | local
  #     accession: SRR19388325
  #   - sample_id: SRR19388327
  #     source: ena
  #     accession: SRR19388327

# =============================================================================
# COMPARISONS
# Multiple comparisons — each generates independent DE, GO, report
# =============================================================================
comparisons:
  - treatment: tumor
    control: normal
  # - treatment: treated
  #   control: untreated

# =============================================================================
# REFERENCE DATABASES
# =============================================================================
databases:
  # Paths may use ${ENV} variables and ~ for portability across machines, e.g.
  #   db_root: ${MOSAIC_REF}
  #   star_index: ${MOSAIC_REF}/star_index
  # then `export MOSAIC_REF=/data/references` before running.
  db_root: /path/to/references   # root for all databases

  # Genome
  genome_fa:     /path/to/references/genome/GRCh38.primary_assembly.genome.fa
  gtf:           /path/to/references/gencode.v49.annotation.gtf

  # Alignment index
  star_index:    /path/to/references/star_index

  # Repetitive elements
  te_consensus:  /path/to/references/dfam/pseudochromosomes/consensus_TE.fa
  te_satellite:  /path/to/references/dfam/pseudochromosomes/consensus_satellite.fa
  rmsk_bed:      /path/to/references/rmsk/rmsk.txt.gz
  te_gtf:        /path/to/references/rmsk/TE.gtf

  # Metatranscriptomics
  kraken2_db:    /path/to/references/kraken2_db
  metaphlan_db:  /path/to/references/humann3_db/metaphlan_db
  chocophlan_db: /path/to/references/humann3_db/chocophlan
  uniref_db:     /path/to/references/humann3_db/uniref

  # Fusion detection (Arriba - binary, not conda)
  arriba_bin:    /path/to/references/arriba_v2.4.0/arriba
  arriba_db:     /path/to/references/arriba_v2.4.0/database

  # Auto-managed (download on first run if missing)
  auto_download: true

# =============================================================================
# CONDA ENVIRONMENTS
# =============================================================================
environments:
  main:    mosaic          # primary env with STAR, featureCounts, DESeq2
  humann:  humann3         # HUMAnN3 + MetaPhlAn (Python 3.9)
  arriba:  null            # null = use arriba_bin directly (not via conda)

# =============================================================================
# ANALYSIS PARAMETERS (PRODUCTION VALUES)
# =============================================================================
thresholds:
  padj:               0.05
  lfc:                1.0
  # RNA editing
  min_cov_editing:    5
  min_score_editing:  1.5
  min_ef_editing:     0.05
  editing_model:      "DirMult:PHRED"  # statistical model for JACUSA2
  # Splicing
  min_reads_splicing: 10
  # TE insertions
  min_clip_te:        30
  min_support_te:     2
  # Metatranscriptomics
  min_reads_meta:     10
  min_samples_meta:   2

# =============================================================================
# MODULES (enable/disable)
# =============================================================================
modules:
  m00_download:     false  # download FASTQs (requires samples.download)
  m02_trim:         true   # fastp trimming
  m04_star:         true   # STAR two-pass alignment
  m05_te_count:     true   # TE quantification (pseudochromosomes)
  m06_circrna:      true   # circRNA detection (CIRI2)
  m07_strandedness: true   # strandedness inference (RSeQC)
  m08_deseq2:       true   # differential expression
  m09_satellite:    true   # satellite quantification
  m10_go:           true   # GO/KEGG/DO enrichment
  m11_te_host:      true   # TE host genes
  m11b_promoter_te: true   # TE in promoters
  m11c_te_age:      true   # TE age analysis
  m11d_te_de:       true   # DE genes with TE annotations
  m12_tetranscripts: true  # TEtranscripts locus-level
  m15_fusion:       true   # fusion genes (Arriba)
  m16_stringtie:    true   # de novo transcripts (StringTie)
  m17_rmats:        true   # differential splicing (rMATS)
  m18_network:      true   # PPI network (STRINGdb) + WGCNA
  m19_editing:      true   # RNA editing (JACUSA2)
  m20_meta:         false  # metatranscriptomics (Kraken2) — OPTIONAL, off by default
  m20b_humann:      false  # functional profiling (HUMAnN3) — OPTIONAL, off by default
  m23_te_insertions: true  # TE somatic insertions
  m14_report:       true   # HTML report (Quarto)

# =============================================================================
# PERFORMANCE
# =============================================================================
threads: 20
memory_gb: 30              # available RAM for STAR BAM sort etc.

# =============================================================================
# TRIMMING
# =============================================================================
trimming:
  min_phred: 20
  min_length: 36
  low_complexity_filter: false   # NEVER true — removes TE reads
  trim_poly_x: false             # NEVER true — removes satellite reads (TTAGGG etc.)

# =============================================================================
# REPORT
# =============================================================================
report:
  title: "MOSAIC Analysis Report"
  remove_test_notes: true        # remove "Note (test data)" callouts
  produce_pdf: false             # also generate PDF (requires LaTeX)
